[package]
name = "wallflux"
description = "Live wallpapers for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A static library as well as the crate, for the Qt program to link: one file
# to build into the binary, and nothing to install beside it.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
ab_glyph = "0.2.32"
glow = "0.18.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21.1"
wayland-egl = "0.32.11"
wpe-format = { version = "0.1.0", path = "../wpe-format" }

[dev-dependencies]
png = "0.18.1"
