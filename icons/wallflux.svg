<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- WallFlux. The five colours are the ones Emblem replaces to match the
       window's theme and accent: the tile's two and the stroke's three. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a44"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38d0ff"/>
      <stop offset="0.55" stop-color="#4b8bff"/>
      <stop offset="1" stop-color="#9a6bff"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tile)"/>
  <path d="M13 20 L22 45 L32 26 L42 45 L51 20" fill="none" stroke="url(#stroke)"
        stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
